services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clarivo}
      POSTGRES_USER: ${POSTGRES_USER:-clarivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarivo}
    ports:
      - "5433:5432"
    volumes:
      - clarivo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-clarivo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-clarivo-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - clarivo_audio:/data

volumes:
  clarivo_db:
  clarivo_audio:
