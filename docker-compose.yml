services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clarivo}
      POSTGRES_USER: ${POSTGRES_USER:-clarivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarivo}
    ports:
      - "5433:5432"
    volumes:
      - clarivo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clarivo_db:
